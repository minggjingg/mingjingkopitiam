:root{--bg:#3b2416;--f:"Lilita One","Game","Arial Rounded MT Bold",system-ui,sans-serif;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24160d}}
:root[data-theme="dark"]{--bg:#24160d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font:20px/1.2 var(--f);letter-spacing:.02em}
button{font-family:var(--f)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(40,20,5,.32) 100%)}
#x{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #3b241699;pointer-events:none}
.key{display:inline-block;font-size:1.45em;line-height:1;min-width:1em;margin:-.32em .4em -.32em -.62em;padding:.1em .3em .06em;vertical-align:middle;border:2px solid #f6d58e;border-radius:8px;background:linear-gradient(#c32f35,#8a1a22);color:#fdf6e3;text-align:center;box-shadow:0 3px 0 #5a0e14,0 4px 8px #0004;text-shadow:0 1px 0 #5a0e14}
#tip{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);padding:2px 14px;border-radius:12px;background:#fdf6e3ee;color:#4a2a18;font-size:16px;display:none;pointer-events:none}
#dlg{position:fixed;z-index:12;left:50%;bottom:6%;transform:translateX(-50%);width:min(92vw,680px);padding:16px 22px;border-radius:20px;background:#fdf6e3f2;border:4px solid #2f6b45;box-shadow:0 7px 0 #1d4630;color:#4a2a18;font-size:clamp(22px,4.6vw,34px);display:none;pointer-events:none}
.a{background:#f3e6c8;border:3px solid #c9a86a;border-radius:12px;padding:0 8px}.b{background:#a8232b;color:#fff;border-radius:12px;padding:0 8px}
#pop{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#1f130b99}
.pb{width:min(92vw,400px);padding:14px 16px 18px;text-align:center;color:#4a2a18;background:radial-gradient(circle at 50% 0,#fffaf0,#f7e9c8 60%,#ecd6a6);border:5px solid #fffaf0;outline:5px solid #2f6b45;border-radius:24px;box-shadow:0 20px 60px #000a}
.pb h2{margin:0 0 8px;font-weight:400;font-size:30px;color:#a8232b}
#pc{width:100%;height:auto;display:block;border-radius:16px;background:linear-gradient(#fff6e6,#f0dcb4)}
.pb button{font-size:24px;border:4px solid #fffaf0;border-radius:16px;color:#fff;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#rd{margin:0 0 10px;padding:8px 14px 6px;border-radius:16px;background:#2b1a10;box-shadow:inset 0 3px 8px #000a;color:#fff3d6;user-select:none;-webkit-user-select:none}
#rk{display:block;font-size:16px;letter-spacing:.12em;opacity:.8}#rv{font-size:52px;letter-spacing:.06em;font-variant-numeric:tabular-nums}#rd .u{font-size:26px;margin-left:4px;opacity:.85}#rt{font-size:15px;opacity:.75;margin-top:2px}
#rd.t{color:#d6995e}#rd.o{color:#8ad36c}#rd.w{color:#a6d6f6}

<script>
(async()=>{
const $=s=>document.querySelector(s),cv=$("#cv"),gl=cv.getContext("webgl2",{antialias:true,powerPreference:"high-performance"}),FF='"Lilita One","Game",sans-serif',ZH='"Kaiti TC","Kaiti SC","STKaiti","KaiTi","BiauKai","DFKai-SB","LXGW WenKai TC","AR PL UKai TW","AR PL UKai CN",serif',PI=Math.PI,rnd=Math.random;

let cVao=null,cTx=null;   /* currently bound VAO / texture, so draws can skip redundant binds */
/* ======== WebGL2 engine (no libraries): PBR-ish lighting, real-time sun shadows, filmic tone mapping ======== */
const VS=`#version 300 es
layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in vec2 t;layout(location=3)in vec3 ac;layout(location=4)in vec3 ae;
uniform mat4 uM,uVP,uLVP;uniform mat3 uN;uniform vec2 uUV;out vec3 vp,vn,vcol,vem;out vec2 vt;out vec4 vl;
void main(){vec4 w=uM*vec4(p,1.);vp=w.xyz;vn=normalize(uN*n);vcol=ac;vem=ae;vt=t*uUV;vl=uLVP*vec4(w.xyz+vn*.012,1.);gl_Position=uVP*w;}`;
const FS=`#version 300 es
precision highp float;precision highp sampler2DShadow;in vec3 vp,vn,vcol,vem;in vec2 vt;in vec4 vl;out vec4 o;
uniform vec3 uC,uE,uCam,uL[8];uniform float uS,uA,uR,uT,uW,uK,uD;uniform vec2 uUV,uOf;uniform sampler2D uTx;uniform sampler2DShadow uSh;
const vec3 SUN=normalize(vec3(-.5,.75,.42)),HOR=vec3(.80,.86,.92),ZEN=vec3(.30,.55,.90);
vec3 sky(vec3 d){float h=max(d.y,0.);vec3 c=mix(HOR,ZEN,pow(h,.55));float s=max(dot(d,SUN),0.);return c+vec3(1.,.85,.6)*(pow(s,8.)*.25+pow(s,900.)*6.);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vnz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+1.),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vnz(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
vec3 aces(vec3 x){x*=.8;return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
float shadow(){vec3 q=vl.xyz/vl.w*.5+.5;if(q.x<0.||q.y<0.||q.x>1.||q.y>1.||q.z>1.)return 1.;vec2 tx=1./vec2(textureSize(uSh,0));float s=0.;
  for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++)s+=texture(uSh,vec3(q.xy+vec2(i,j)*tx*1.1,q.z-.0005));return s/9.;}
void main(){
  vec3 N=normalize(vn);
  vec2 uv=vt;
  if(uW>.5){vec3 q=abs(N);uv=(q.y>=q.x&&q.y>=q.z?vp.xz:(q.x>=q.z?vp.zy:vp.xy))*uUV+uOf;}   /* world-space mapping: same texel size on every wall/floor face */
  vec3 V=normalize(uCam-vp);float dist=length(vp-uCam),hz=smoothstep(22.,58.,dist)*.7;
  if(uT>2.5){vec3 d=-V,c=sky(d);if(d.y>0.){vec2 q=d.xz/(d.y+.15)*1.3+vec2(uK*.004,0.);float f=fbm(q),cl=smoothstep(.48,.78,f)*smoothstep(0.,.2,d.y);c=mix(c,vec3(1.,.97,.93)*(.82+.4*smoothstep(.5,.9,f))+vec3(.15,.1,.05)*max(dot(d,SUN),0.),cl*.9);}o=vec4(pow(aces(c*1.25),vec3(1./2.2)),1.);return;}   /* sky dome */
  vec3 HZ=pow(aces(HOR*1.25),vec3(1./2.2));
  if(uT>1.5){vec4 k=texture(uTx,uv);float sh=mix(.55,1.,shadow());o=vec4(mix(k.rgb*sh,HZ,hz),k.a*uA);return;}
  vec3 b=pow(uC*vcol,vec3(2.2));
  if(uT>.5)b*=pow(texture(uTx,uv).rgb,vec3(2.2));
  float ins=smoothstep(-.3,.15,vp.x)*step(vp.x,11.3)*step(-.05,vp.z)*step(vp.z,5.62)*step(vp.y,3.15);
  float smg=1.;
  if(uD>.5){   /* surface detail: wood grain, brushed steel, paint mottling, recessed grout - procedural, world-space, with derivative bump */
    vec3 q=abs(N);vec2 A=q.y>=q.x&&q.y>=q.z?vp.xz:(q.x>=q.z?vp.zy:vp.xy);vec3 sr=sqrt(b);float hgt=0.,bk=0.;
    if(uT<.5){float wd=smoothstep(.1,.22,sr.r-sr.b)*step(sr.b,sr.g+.02)*(1.-smoothstep(.62,.7,(sr.r-sr.b)/max(sr.r,.01)))*(1.-smoothstep(.8,.95,sr.r))*(1.-step(.6,uS));
      if(wd>.01){float gn=vnz(vec2(A.x*1.3,A.y*7.)),g=vnz(vec2(A.x*2.,A.y*55.+gn*5.)),ln=smoothstep(.62,.92,fract(A.y*9.+gn*3.));
        b*=mix(1.,(.8+.36*g)*(1.-.2*ln),wd);hgt=(g*.6-ln*.6)*wd;bk=.0018*wd;}
      else if(uS>.85){float br=vnz(vec2(A.x*2.,A.y*260.))*.6+vnz(vec2(A.x,A.y*80.))*.4;b*=.94+.12*br;smg=.65+.7*vnz(A*4.5);hgt=br;bk=.00025;}
      else{float m1=vnz(A*6.),m2=vnz(A*85.);b*=.95+.08*m1+.06*(m2-.5);hgt=m2;bk=.0004;}}
    else{hgt=dot(texture(uTx,uv).rgb,vec3(.3,.59,.11));bk=uW>.5?.004:.0015;b*=.96+.08*vnz(A*120.);}
    b*=1.-.14*ins*(1.-smoothstep(0.,.35,vp.y))*vnz(A*3.);   /* scuffs and grime near the floor */
    vec3 dx=dFdx(vp),dy=dFdy(vp);float hx=dFdx(hgt*bk),hy=dFdy(hgt*bk);vec3 r1=cross(dy,N),r2=cross(N,dx);float dt=dot(dx,r1);
    if(abs(dt)>1e-12)N=normalize(mix(N,normalize(abs(dt)*N-sign(dt)*(hx*r1+hy*r2)),1.-smoothstep(10.,26.,dist)));}
  float ao=mix(.55,1.,smoothstep(0.,.9,vp.y))*mix(1.,mix(.72,1.,smoothstep(0.,1.2,min(min(vp.z,11.2-vp.x),5.6-vp.z+2.))),ins);   /* cheap ambient occlusion: darker near the floor and corners */
  float sh=shadow();
  vec3 amb=mix(vec3(.30,.27,.24),vec3(.62,.70,.82),N.y*.5+.5)*mix(vec3(1.),vec3(.7,.6,.48),ins);
  vec3 c=b*amb*ao;
  float nd=max(dot(N,SUN),0.);c+=b*vec3(1.,.88,.7)*nd*1.9*sh;
  c+=b*vec3(1.,.74,.48)*ins*.26*ao;
  vec3 H=normalize(SUN+V);float gl=mix(16.,140.,uS);vec3 sc=vec3(1.,.9,.75)*pow(max(dot(N,H),0.),gl)*nd*sh*(gl+8.)/40.;
  if(ins>.01)for(int i=0;i<8;i++){vec3 d=uL[i]-vp;float r=length(d);if(r>9.)continue;d/=r;float a=1./(1.+.3*r*r),dd=max(dot(N,d),0.);
   c+=b*vec3(1.,.78,.52)*dd*a*.9;sc+=vec3(1.,.96,.9)*pow(max(dot(N,normalize(d+V)),0.),gl)*dd*a*(gl+8.)/60.;}
  float fr=pow(1.-max(dot(N,V),0.),5.);
  c*=mix(vec3(1.),vec3(1.12,.95,.76),ins);   /* warm tungsten-ish hue indoors */
  c+=(sc*uS*.6+sky(reflect(-V,N))*(.04+.5*fr)*uS*uS*mix(1.,.35,ins)*ao)*smg+fr*uR*.25*vec3(1.,.95,.85)+uE+vem;
  o=vec4(mix(pow(aces(c),vec3(1./2.2)),HZ,hz),uA);}`;
const mkP=(vs,fs)=>{const pr=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);gl.attachShader(pr,x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x))}gl.linkProgram(pr);return pr};

const U={};for(const k of"uM uN uVP uLVP uC uE uCam uL uS uA uR uT uTx uUV uW uOf uK uSh uD".split(" "))U[k]=gl.getUniformLocation(pr,k);
gl.uniform1i(U.uTx,0);gl.uniform1i(U.uSh,1);gl.vertexAttrib3f(3,1,1,1);gl.vertexAttrib3f(4,0,0,0);gl.enable(gl.DEPTH_TEST);gl.clearColor(.8,.86,.92,1);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
/* shadow map: depth-only pass from the sun, alpha-tested so the lattice grilles cast patterned shadows */
const SPR=mkP(`#version 300 es
layout(location=0)in vec3 p;layout(location=2)in vec2 t;uniform mat4 uM,uLVP;uniform vec2 uUV;out vec2 vt;void main(){vt=t*uUV;gl_Position=uLVP*uM*vec4(p,1.);}`,`#version 300 es
precision mediump float;in vec2 vt;uniform sampler2D uTx;uniform float uAT;out vec4 o;void main(){if(uAT>.5&&texture(uTx,vt).a<.5)discard;o=vec4(1.);}`);
